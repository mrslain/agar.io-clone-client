<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clan Wars - Multiplayer Arena</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            overflow: hidden;
            color: #fff;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Login Screen */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #login-screen h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        #login-screen .subtitle {
            font-size: 18px;
            color: #888;
            margin-bottom: 40px;
        }

        #login-form {
            background: rgba(255,255,255,0.05);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            width: 400px;
            max-width: 90%;
        }

        #login-form input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 16px;
        }

        #login-form input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .faction-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .faction-btn {
            padding: 15px;
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .faction-btn:hover {
            transform: scale(1.05);
        }

        .faction-btn.selected {
            border-color: #fff;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        .faction-btn.red { background: linear-gradient(135deg, #E74C3C, #C0392B); }
        .faction-btn.blue { background: linear-gradient(135deg, #3498DB, #2980B9); }
        .faction-btn.green { background: linear-gradient(135deg, #2ECC71, #27AE60); }
        .faction-btn.purple { background: linear-gradient(135deg, #9B59B6, #8E44AD); }

        .faction-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .faction-bonus {
            font-size: 11px;
            opacity: 0.8;
        }

        #play-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #play-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.5);
        }

        /* Game UI */
        #game-ui {
            display: none;
            position: fixed;
            pointer-events: none;
        }

        #game-ui.visible {
            display: block;
        }

        /* Leaderboard */
        #leaderboard {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            min-width: 200px;
            pointer-events: auto;
        }

        #leaderboard h3 {
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
        }

        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .leaderboard-entry:last-child {
            border-bottom: none;
        }

        .leaderboard-entry .rank {
            color: #888;
            width: 25px;
        }

        .leaderboard-entry .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .leaderboard-entry .mass {
            color: #888;
            margin-left: 10px;
        }

        /* Faction Stats */
        #faction-stats {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            min-width: 180px;
            pointer-events: auto;
        }

        #faction-stats h3 {
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
        }

        .faction-stat {
            display: flex;
            align-items: center;
            padding: 5px 0;
            font-size: 12px;
        }

        .faction-stat .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .faction-stat .info {
            flex: 1;
        }

        .faction-stat .bases {
            color: #ffd700;
            font-size: 11px;
        }

        /* Player Info */
        #player-info {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            pointer-events: auto;
        }

        #player-info .mass-display {
            font-size: 24px;
            font-weight: bold;
        }

        #player-info .controls {
            font-size: 11px;
            color: #888;
            margin-top: 10px;
        }

        /* Minimap */
        #minimap {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 150px;
            height: 150px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.2);
            pointer-events: auto;
        }

        /* Chat */
        #chat {
            position: fixed;
            bottom: 170px;
            right: 10px;
            width: 250px;
            pointer-events: auto;
        }

        #chat-messages {
            height: 150px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 10px 10px 0 0;
            font-size: 12px;
        }

        .chat-message {
            margin-bottom: 5px;
            word-wrap: break-word;
        }

        .chat-message .sender {
            font-weight: bold;
        }

        #chat-input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 0 0 10px 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 12px;
        }

        #chat-input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        /* Death Screen */
        #death-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        #death-screen.visible {
            display: flex;
        }

        #death-screen h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        #death-screen .final-score {
            font-size: 24px;
            margin-bottom: 30px;
            color: #888;
        }

        #respawn-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen">
        <h1>⚔️ Clan Wars</h1>
        <p class="subtitle">Multiplayer Arena Battle</p>
        <div id="login-form">
            <input type="text" id="player-name" placeholder="Enter your name" maxlength="20">
            <p style="margin-bottom: 10px; color: #888; font-size: 12px;">Choose your faction:</p>
            <div class="faction-selector">
                <div class="faction-btn red" data-faction="RED">
                    <div class="faction-name">🔴 Crimson Legion</div>
                    <div class="faction-bonus">+10% Speed</div>
                </div>
                <div class="faction-btn blue" data-faction="BLUE">
                    <div class="faction-name">🔵 Azure Dynasty</div>
                    <div class="faction-bonus">+10% Mass Gain</div>
                </div>
                <div class="faction-btn green" data-faction="GREEN">
                    <div class="faction-name">🟢 Emerald Order</div>
                    <div class="faction-bonus">Mass Regen</div>
                </div>
                <div class="faction-btn purple" data-faction="PURPLE">
                    <div class="faction-name">🟣 Violet Empire</div>
                    <div class="faction-bonus">Fast Split</div>
                </div>
            </div>
            <button id="play-btn">Play</button>
        </div>
    </div>

    <!-- Game Canvas -->
    <canvas id="canvas"></canvas>

    <!-- Game UI -->
    <div id="game-ui">
        <!-- Faction Stats -->
        <div id="faction-stats">
            <h3>Clan War</h3>
            <div id="faction-stats-list"></div>
        </div>

        <!-- Leaderboard -->
        <div id="leaderboard">
            <h3>Leaderboard</h3>
            <div id="leaderboard-list"></div>
        </div>

        <!-- Player Info -->
        <div id="player-info">
            <div class="mass-display">Mass: <span id="player-mass">0</span></div>
            <div class="controls">
                Space: Split | W: Eject Mass<br>
                Enter: Chat
            </div>
        </div>

        <!-- Minimap -->
        <canvas id="minimap"></canvas>

        <!-- Chat -->
        <div id="chat">
            <div id="chat-messages"></div>
            <input type="text" id="chat-input" placeholder="Press Enter to chat...">
        </div>
    </div>

    <!-- Death Screen -->
    <div id="death-screen">
        <h2>You were eaten!</h2>
        <div class="final-score">Final Score: <span id="final-score">0</span></div>
        <button id="respawn-btn">Respawn</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
